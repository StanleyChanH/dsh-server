# Builds the dsh image and inspects what is inside it.
#
# The image is about 3.4 GB and takes several minutes to build, so this runs
# only when something under dsh/ changes (or the checker itself) and on demand,
# not on every pull request.
name: dsh image

on:
  push:
    branches: [master]
    paths: [dsh/**, scripts/check.sh, .github/workflows/dsh-image.yml]
  pull_request:
    paths: [dsh/**, scripts/check.sh, .github/workflows/dsh-image.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: build and inspect
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free disk space
        # The image is about 3.4 GB. The toolkits preinstalled on the runner are
        # not needed for this job.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build and inspect
        run: scripts/check.sh image
