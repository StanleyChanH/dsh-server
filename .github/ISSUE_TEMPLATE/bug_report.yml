name: Bug report
description: Something does not work the way the documentation says it does.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a report.

        **Do not paste tokens, session cookies, passwords or `.env` contents.** The start-up URL that dsh prints, and the output of `docker compose logs dsh`, contain the dsh token.

        For a security problem, read [SECURITY.md](https://github.com/StanleyChanH/dsh-server/blob/master/SECURITY.md) instead of opening an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: The failing part of `scripts/smoke.sh`, or `docker compose ps` and `docker compose logs <service>`. Mask tokens.
      render: shell
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The dsh version (`DSH_VERSION` in `.env`), and `docker version` and `docker compose version`.
      placeholder: dsh 0.2.2-rc.5, Docker 29.7.2, Compose v5.5.0
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host
      description: Operating system, and how members reach the stack (LAN, VPN, ...).
      placeholder: Ubuntu 24.04, reachable over Tailscale
